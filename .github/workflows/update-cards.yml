name: Update profile cards
on:
  schedule: [{ cron: "30 1 * * *" }]
  workflow_dispatch:
  push: { branches: [main], paths: ["scripts/**", "fonts/**"] }
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GH_USER: "${{ github.repository_owner }}" }
      - name: Render README cards
        run: python scripts/render_readme_cards.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          git diff --cached --quiet || (git commit -m "chore: refresh profile cards" && git push)
