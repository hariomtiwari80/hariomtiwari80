name: Update profile cards

on:
  schedule:
    - cron: "30 0 * * *" # every day at 06:00 IST
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - config.json
      - README.template.md
      - scripts/**
      - assets/**
      - fonts/**

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools (measures text so chips and wrapping fit)
        run: pip install fonttools

      - name: Fetch contributions and repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, graph, months, tiles, repos)
        run: python scripts/render_readme_cards.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data cards README.md
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi

